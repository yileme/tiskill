name: Verify tiskill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validate.py
      - run: python3 tools/validate_eu_reading.py
      - run: python3 -m unittest tools.test_public_service tools.test_medical_paper
      - run: python3 tools/test_update.py
      - run: python3 tools/test_diagnosis_save.py
      - run: python3 -m unittest discover -s cat -p 'test_*.py'
      - run: python3 -m unittest tools.test_library tools.test_bilingual
      - run: python3 tools/test_business.py
      - run: python3 -m pip install pypdf pymupdf openpyxl
      - run: python3 -m unittest tools.test_reading
